name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.14.2

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Construir portable e instalador
        shell: pwsh
        run: ./build_release.ps1

      - name: Guardar archivos como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_6.0_Windows
          path: |
            release/AUDITOR_IA_6.0_Setup.exe
            release/AUDITOR_IA_6.0_Portable.zip
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/AUDITOR_IA_6.0_Setup.exe" `
            "release/AUDITOR_IA_6.0_Portable.zip" `
            --title "AUDITOR IA 6.0" `
            --notes "Versión 6.0 para Windows. Incluye instalador y edición portable. La primera carga del modelo puede requerir conexión a internet."
