name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar PyTorch CPU
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.14.2 "pyinstaller-hooks-contrib>=2025.8"

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Construir portable e instalador
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./build_release.ps1

      - name: Verificar ejecutable empaquetado
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path "dist" `
            -Filter "AUDITOR_IA.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "No se encontró AUDITOR_IA.exe para la prueba de arranque."
          }

          Write-Host "PROBANDO EJECUTABLE REAL:"
          Write-Host $exe.FullName

          $env:AUDITOR_IA_SELF_TEST = "1"

          $process = Start-Process `
            -FilePath $exe.FullName `
            -WorkingDirectory $exe.Directory.FullName `
            -Wait `
            -PassThru

          Remove-Item Env:AUDITOR_IA_SELF_TEST

          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path `
              $exe.Directory.FullName `
              "runtime_self_test_error.txt"

            if (Test-Path $errorFile) {
              Write-Host "ERROR DEL SELF-TEST:"
              Get-Content $errorFile
            }

            throw "El ejecutable empaquetado no superó la prueba de dependencias. ExitCode=$($process.ExitCode)"
          }

          Write-Host "SELF-TEST DEL EJECUTABLE: CORRECTO"

      - name: Guardar archivos como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_6.1.1_Windows
          path: |
            release/AUDITOR_IA_6.1.1_Setup.exe
            release/AUDITOR_IA_6.1.1_Portable.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/AUDITOR_IA_6.1.1_Setup.exe" `
            "release/AUDITOR_IA_6.1.1_Portable.zip" `
            --title "AUDITOR IA 6.1.1" `
            --notes "Versión 6.1.1 para Windows. Incluye Faster-Whisper Base/Small y pyannote Community-1 para identificación profesional de exactamente dos participantes."
