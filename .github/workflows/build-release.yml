name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar PyTorch CPU
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub>=0.23,<1.0"
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.14.2
          python -c "import huggingface_hub; print('huggingface_hub OK:', huggingface_hub.__version__)"

      - name: Instalar herramientas de empaquetado
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          choco install 7zip --no-progress -y
          & "C:\Program Files\7-Zip\7z.exe" | Select-Object -First 3

      - name: Construir portable e instalador
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./build_release.ps1

      - name: Guardar archivos como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_6.1.1_Windows
          path: |
            release/AUDITOR_IA_6.1.1_Setup.exe
            release/AUDITOR_IA_6.1.1_Portable.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/AUDITOR_IA_6.1.1_Setup.exe" `
            "release/AUDITOR_IA_6.1.1_Portable.zip" `
            --title "AUDITOR IA 6.1.1" `
            --notes "Versión 6.1.1 para Windows. Incluye Faster-Whisper Base/Small y pyannote Community-1 para identificación profesional de exactamente dos participantes."
