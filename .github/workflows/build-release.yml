name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: powershell
          cache-environment: false

      - name: Instalar FFmpeg 7 Shared
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE ".ffmpeg7"
          micromamba create -y -p "$prefix" -c conda-forge "ffmpeg=7.*"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar FFmpeg 7." }

          $ffmpegBin = Join-Path $prefix "Library\bin"
          if (-not (Test-Path "$ffmpegBin\ffmpeg.exe")) { throw "ffmpeg.exe no encontrado." }

          foreach ($pattern in @("avcodec-*.dll","avformat-*.dll","avutil-*.dll","swresample-*.dll")) {
            if (-not (Get-ChildItem $ffmpegBin -Filter $pattern -File)) { throw "FFmpeg Shared incompleto: $pattern" }
          }

          $line = & "$ffmpegBin\ffmpeg.exe" -version | Select-Object -First 1
          Write-Host $line
          if ($line -notmatch "ffmpeg version 7") { throw "FFmpeg instalado no es major 7." }

          "AUDITOR_IA_FFMPEG_BIN=$ffmpegBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Preparar Python y PyTorch CPU
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "Fallo actualizando pip." }
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "Fallo PyTorch CPU." }

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements.txt fallo." }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check detecto incompatibilidades." }

      - name: Verificar runtime antes de compilar
        shell: pwsh
        run: |
          python scripts\verify_native_runtime.py --ffmpeg-bin "$env:AUDITOR_IA_FFMPEG_BIN"
          if ($LASTEXITCODE -ne 0) { throw "Runtime previo fallo." }

      - name: Instalar herramientas de build
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.14.2 "pyinstaller-hooks-contrib>=2025.8"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller fallo al instalar." }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fallo al instalar." }
          choco install 7zip --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "7-Zip fallo al instalar." }

      - name: Construir portable e instalador
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./build_release.ps1

      - name: Self-test del EXE real
        shell: pwsh
        run: |
          $exe = "dist\AUDITOR_IA_6.1.1_PORTABLE\AUDITOR_IA.exe"
          if (-not (Test-Path $exe)) { throw "EXE no existe." }

          $env:AUDITOR_IA_SELF_TEST = "1"
          $process = Start-Process -FilePath $exe -WorkingDirectory "dist\AUDITOR_IA_6.1.1_PORTABLE" -Wait -PassThru
          Remove-Item Env:AUDITOR_IA_SELF_TEST

          if ($process.ExitCode -ne 0) {
            $err = "dist\AUDITOR_IA_6.1.1_PORTABLE\runtime_self_test_error.txt"
            if (Test-Path $err) { Get-Content $err }
            throw "SELF-TEST fallo. ExitCode=$($process.ExitCode)"
          }
          Write-Host "SELF-TEST DEL EXE: CORRECTO"

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_6.1.1_Windows
          path: |
            release/AUDITOR_IA_6.1.1_Setup.exe
            release/AUDITOR_IA_6.1.1_Portable.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/AUDITOR_IA_6.1.1_Setup.exe" `
            "release/AUDITOR_IA_6.1.1_Portable.zip" `
            --title "AUDITOR IA 6.1.1" `
            --notes "Windows build validado con PySide6, Faster-Whisper, PyTorch 2.8, TorchCodec 0.7, FFmpeg 7 Shared y pyannote Community-1."
