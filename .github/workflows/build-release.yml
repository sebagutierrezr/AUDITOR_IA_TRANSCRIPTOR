name: Build Windows Installer 8.0 FIX DEFINITIVO
run-name: AUDITOR IA 8.0.0 · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    tags:
      - 'v8*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencias Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.14.2 "pyinstaller-hooks-contrib>=2025.8"
          python --version
          cmake --version
          ninja --version

      - name: Preparar FFmpeg Shared portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-full-shared.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared'
          $target = Join-Path $env:GITHUB_WORKSPACE 'build_assets\ffmpeg\bin'

          Remove-Item -Force -ErrorAction SilentlyContinue $archive
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Split-Path $target -Parent)
          New-Item -ItemType Directory -Force $extract | Out-Null
          New-Item -ItemType Directory -Force $target | Out-Null

          Write-Host "Descargando FFmpeg Shared: $url"
          & curl.exe -L --fail --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o $archive $url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) {
            throw 'No se pudo descargar FFmpeg Shared.'
          }

          & 7z.exe x $archive "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo extraer FFmpeg Shared.' }

          $ffmpegExe = Get-ChildItem -Path $extract -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw 'No se encontro ffmpeg.exe en el paquete descargado.' }
          $sourceBin = $ffmpegExe.Directory.FullName

          Copy-Item -Path (Join-Path $sourceBin '*') -Destination $target -Recurse -Force

          $ffmpeg = Join-Path $target 'ffmpeg.exe'
          $ffprobe = Join-Path $target 'ffprobe.exe'
          if (-not (Test-Path $ffmpeg)) { throw 'Falta build_assets\ffmpeg\bin\ffmpeg.exe.' }
          if (-not (Test-Path $ffprobe)) { throw 'Falta build_assets\ffmpeg\bin\ffprobe.exe.' }

          foreach ($pattern in @('avcodec-*.dll','avformat-*.dll','avutil-*.dll','swresample-*.dll')) {
            if (-not (Get-ChildItem -Path $target -Filter $pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "FFmpeg Shared incompleto: falta $pattern"
            }
          }

          $target | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "AUDITOR_IA_FFMPEG_BIN=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $ffmpeg -version | Select-Object -First 1
          & $ffprobe -version | Select-Object -First 1
          Write-Host "FFmpeg listo en $target"

      - name: Build NeMo-Speech.cpp CPU ASR + SortFormer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue '.nemo-src', '.nemo-build'

          git clone --depth 1 --recurse-submodules https://github.com/NVIDIA/NeMo-Speech.cpp.git .nemo-src
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo clonar NeMo-Speech.cpp.' }

          Push-Location .nemo-src
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\build.ps1 -Backend cpu -BuildDir "$env:GITHUB_WORKSPACE\.nemo-build" -Config Release -Http
            if ($LASTEXITCODE -ne 0) { throw 'Build NeMo-Speech fallo.' }
          }
          finally {
            Pop-Location
          }

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'build_assets\nemo-speech'
          New-Item -ItemType Directory -Force 'build_assets\nemo-speech' | Out-Null
          cmake --install .nemo-build --config Release --prefix "$env:GITHUB_WORKSPACE\build_assets\nemo-speech"
          if ($LASTEXITCODE -ne 0) { throw 'Install NeMo-Speech fallo.' }

          $nemo = 'build_assets\nemo-speech\bin\nemo-speech.exe'
          if (-not (Test-Path $nemo)) { throw 'Falta nemo-speech.exe despues de compilar.' }
          & $nemo --version
          if ($LASTEXITCODE -ne 0) { throw 'nemo-speech.exe no inicia correctamente.' }

      - name: Convertir Nemotron 3.5 y SortFormer Q8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Push-Location .nemo-src
          try {
            python -m pip install -r requirements.txt
            New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\build_assets\models" | Out-Null

            python convert_model.py nvidia/nemotron-3.5-asr-streaming-0.6b --outfile "$env:GITHUB_WORKSPACE\build_assets\models\nemotron-3.5-asr-streaming-0.6b.q8_0.gguf" --outtype q8_0
            if ($LASTEXITCODE -ne 0) { throw 'Conversion Nemotron 3.5 fallo.' }

            python convert_model.py nvidia/diar_streaming_sortformer_4spk-v2 --outfile "$env:GITHUB_WORKSPACE\build_assets\models\sortformer-v2-q8_0.gguf" --outtype q8_0
            if ($LASTEXITCODE -ne 0) { throw 'Conversion SortFormer fallo.' }
          }
          finally {
            Pop-Location
          }

      - name: Descargar Faster-Whisper Small para modo En vivo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import shutil
          from huggingface_hub import snapshot_download

          target = Path('build_assets/models/small').resolve()
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)

          snapshot_download(
              repo_id='Systran/faster-whisper-small',
              local_dir=str(target),
              allow_patterns=[
                  'model.bin',
                  'config.json',
                  'tokenizer.json',
                  'vocabulary.*',
                  'preprocessor_config.json',
              ],
          )

          required = ('model.bin', 'config.json', 'tokenizer.json')
          missing = [name for name in required if not (target / name).is_file()]
          if missing:
              raise RuntimeError('Faster-Whisper Small incompleto: ' + ', '.join(missing))

          print('Faster-Whisper Small listo:', target)
          print('model.bin MB:', round((target / 'model.bin').stat().st_size / 1024 / 1024, 1))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Descarga de Faster-Whisper Small fallo.' }

      - name: Verificar todos los activos antes de empaquetar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'build_assets\ffmpeg\bin\ffmpeg.exe',
            'build_assets\ffmpeg\bin\ffprobe.exe',
            'build_assets\nemo-speech\bin\nemo-speech.exe',
            'build_assets\models\nemotron-3.5-asr-streaming-0.6b.q8_0.gguf',
            'build_assets\models\sortformer-v2-q8_0.gguf',
            'build_assets\models\small\model.bin',
            'build_assets\models\small\config.json',
            'build_assets\models\small\tokenizer.json'
          )

          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Falta activo requerido: $item" }
            if ((Get-Item $item).Length -le 0) { throw "Activo vacio: $item" }
          }

          & 'build_assets\nemo-speech\bin\nemo-speech.exe' doctor
          if ($LASTEXITCODE -ne 0) { throw 'nemo-speech doctor fallo.' }

          & 'build_assets\ffmpeg\bin\ffmpeg.exe' -version | Select-Object -First 1

      - name: Tests Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest tests.test_nemo_parser tests.test_role_classifier tests.test_file_selector_stability tests.test_live_restored tests.test_build_script_import_path -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests Python fallaron.' }

      - name: Construir y validar Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build_release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'build_release.ps1 fallo.' }

      - name: Verificar Setup final
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = 'release\AUDITOR_IA_8.0.0_Setup.exe'
          if (-not (Test-Path $setup)) { throw 'No se genero el Setup final.' }
          $bytes = (Get-Item $setup).Length
          if ($bytes -lt 1048576) { throw "El Setup generado parece invalido: $bytes bytes" }
          Write-Host "Setup OK: $setup - $([math]::Round($bytes / 1MB, 2)) MB"

      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_8.0.0_Setup
          path: release/AUDITOR_IA_8.0.0_Setup.exe
          if-no-files-found: error
          compression-level: 0
