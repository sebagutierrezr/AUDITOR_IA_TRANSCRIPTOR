name: Build Windows Installer 8.0.1 STABLE
run-name: AUDITOR IA 8.0.1 STABLE · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    tags:
      - 'v8.0.1*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencias de la aplicacion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.14.2 "pyinstaller-hooks-contrib>=2025.8"
          python -c "import PySide6, numpy, av, ctranslate2, faster_whisper, sounddevice, pyaudiowpatch, psutil; print('Dependencias Python OK')"

      - name: FFmpeg Shared portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-full-shared.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared'
          $target = Join-Path $env:GITHUB_WORKSPACE 'build_assets\ffmpeg\bin'

          Remove-Item -Force -ErrorAction SilentlyContinue $archive
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Split-Path $target -Parent)
          New-Item -ItemType Directory -Force $extract | Out-Null
          New-Item -ItemType Directory -Force $target | Out-Null

          & curl.exe -L --fail --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o $archive $url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) { throw 'No se pudo descargar FFmpeg Shared.' }
          & 7z.exe x $archive "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo extraer FFmpeg Shared.' }

          $ffmpegExe = Get-ChildItem -Path $extract -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw 'No se encontro ffmpeg.exe.' }
          Copy-Item -Path (Join-Path $ffmpegExe.Directory.FullName '*') -Destination $target -Recurse -Force

          foreach ($required in @('ffmpeg.exe','ffprobe.exe')) {
            if (-not (Test-Path (Join-Path $target $required))) { throw "Falta $required" }
          }
          foreach ($pattern in @('avcodec-*.dll','avformat-*.dll','avutil-*.dll','swresample-*.dll')) {
            if (-not (Get-ChildItem -Path $target -Filter $pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "FFmpeg Shared incompleto: falta $pattern"
            }
          }
          & (Join-Path $target 'ffmpeg.exe') -version | Select-Object -First 1

      - name: NeMo-Speech CPU oficial v0.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/NVIDIA/NeMo-Speech.cpp/releases/tags/v0.1.0'
          $headers = @{ 'User-Agent' = 'AUDITOR-IA-build' }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $release.assets | Where-Object {
            $_.name -match '(windows|win)' -and
            $_.name -match '(x86_64|x64|amd64)' -and
            $_.name -match 'cpu' -and
            $_.name -notmatch 'sha256'
          } | Select-Object -First 1

          if (-not $asset) {
            $names = ($release.assets | ForEach-Object { $_.name }) -join ', '
            throw "No se encontro el binario Windows x64 CPU de NeMo-Speech v0.1.0. Assets: $names"
          }

          Write-Host "NeMo asset: $($asset.name)"
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extract = Join-Path $env:RUNNER_TEMP 'nemo-release'
          $target = Join-Path $env:GITHUB_WORKSPACE 'build_assets\nemo-speech'
          Remove-Item -Force -ErrorAction SilentlyContinue $archive
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract, $target
          New-Item -ItemType Directory -Force $extract | Out-Null
          New-Item -ItemType Directory -Force $target | Out-Null

          & curl.exe -L --fail --retry 4 --retry-all-errors --retry-delay 5 -o $archive $asset.browser_download_url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) { throw 'No se pudo descargar NeMo-Speech.' }

          if ($asset.name -match '\.zip$') {
            Expand-Archive -Path $archive -DestinationPath $extract -Force
          }
          elseif ($asset.name -match '\.(tar\.gz|tgz)$') {
            & tar.exe -xzf $archive -C $extract
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo extraer NeMo-Speech.' }
          }
          else {
            throw "Formato de NeMo-Speech no soportado: $($asset.name)"
          }

          $nemoExe = Get-ChildItem -Path $extract -Filter 'nemo-speech.exe' -File -Recurse | Select-Object -First 1
          if (-not $nemoExe) { throw 'El paquete oficial no contiene nemo-speech.exe.' }
          $packageRoot = if ($nemoExe.Directory.Name -ieq 'bin') { $nemoExe.Directory.Parent.FullName } else { $nemoExe.Directory.FullName }
          Copy-Item -Path (Join-Path $packageRoot '*') -Destination $target -Recurse -Force

          $normalized = Join-Path $target 'bin\nemo-speech.exe'
          if (-not (Test-Path $normalized)) {
            New-Item -ItemType Directory -Force (Join-Path $target 'bin') | Out-Null
            Copy-Item -Path (Join-Path $nemoExe.Directory.FullName '*') -Destination (Join-Path $target 'bin') -Recurse -Force
          }
          if (-not (Test-Path $normalized)) { throw 'No se pudo normalizar nemo-speech.exe.' }
          & $normalized --version
          & $normalized doctor
          if ($LASTEXITCODE -ne 0) { throw 'NeMo-Speech oficial no inicia correctamente.' }

      - name: Convertir SortFormer Q8 en entorno aislado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue '.nemo-converter', '.convert-venv'
          git clone --depth 1 --branch v0.1.0 https://github.com/NVIDIA/NeMo-Speech.cpp.git .nemo-converter
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo obtener el conversor NeMo-Speech v0.1.0.' }

          python -m venv .convert-venv
          .\.convert-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.convert-venv\Scripts\python.exe -m pip install -r .\.nemo-converter\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron instalar dependencias del conversor.' }

          New-Item -ItemType Directory -Force 'build_assets\models' | Out-Null
          .\.convert-venv\Scripts\python.exe .\.nemo-converter\convert_model.py nvidia/diar_streaming_sortformer_4spk-v2 --outfile .\build_assets\models\sortformer-v2-q8_0.gguf --outtype q8_0
          if ($LASTEXITCODE -ne 0) { throw 'Conversion SortFormer fallo.' }

      - name: Descargar Faster-Whisper Small
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import shutil
          from huggingface_hub import snapshot_download

          target = Path('build_assets/models/small').resolve()
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)
          snapshot_download(
              repo_id='Systran/faster-whisper-small',
              local_dir=str(target),
              allow_patterns=['model.bin','config.json','tokenizer.json','vocabulary.*','preprocessor_config.json'],
          )
          required = ('model.bin','config.json','tokenizer.json')
          missing = [name for name in required if not (target / name).is_file()]
          if missing:
              raise RuntimeError('Faster-Whisper Small incompleto: ' + ', '.join(missing))
          print('Faster-Whisper Small listo:', round((target / 'model.bin').stat().st_size / 1024 / 1024, 1), 'MB')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Descarga Faster-Whisper Small fallo.' }

      - name: Verificar activos antes del build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'build_assets\ffmpeg\bin\ffmpeg.exe',
            'build_assets\ffmpeg\bin\ffprobe.exe',
            'build_assets\nemo-speech\bin\nemo-speech.exe',
            'build_assets\models\sortformer-v2-q8_0.gguf',
            'build_assets\models\small\model.bin',
            'build_assets\models\small\config.json',
            'build_assets\models\small\tokenizer.json'
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Falta activo: $item" }
            if ((Get-Item $item).Length -le 0) { throw "Activo vacio: $item" }
          }
          & 'build_assets\nemo-speech\bin\nemo-speech.exe' model info 'build_assets\models\sortformer-v2-q8_0.gguf'
          if ($LASTEXITCODE -ne 0) { throw 'SortFormer no puede abrirse.' }
          python -c "import pyaudiowpatch, sounddevice, faster_whisper, ctranslate2; print('Runtime Python OK')"

      - name: Tests 8.0.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q app main.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests Python fallaron.' }

      - name: Construir y validar Setup 8.0.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build_release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'build_release.ps1 fallo.' }

      - name: Verificar Setup final
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = 'release\AUDITOR_IA_8.0.1_Setup.exe'
          if (-not (Test-Path $setup)) { throw 'No se genero el Setup final.' }
          $bytes = (Get-Item $setup).Length
          if ($bytes -lt 1048576) { throw "Setup invalido: $bytes bytes" }
          Write-Host "Setup OK: $([math]::Round($bytes / 1MB, 2)) MB"

      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_8.0.1_Setup
          path: release/AUDITOR_IA_8.0.1_Setup.exe
          if-no-files-found: error
          compression-level: 0
