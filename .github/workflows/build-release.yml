name: Build Windows Installer 8.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v8*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python app dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.14.2 "pyinstaller-hooks-contrib>=2025.8"
          python --version
          cmake --version
          ninja --version

      - name: FFmpeg Shared portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-full-shared.7z'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared'

          if (Test-Path $archive) { Remove-Item $archive -Force }
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Force $extract | Out-Null

          Write-Host "Descargando FFmpeg Shared desde $url"
          & curl.exe -L --fail --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar FFmpeg Shared.' }
          if (-not (Test-Path $archive)) { throw 'No se genero el archivo descargado de FFmpeg.' }

          Write-Host 'Extrayendo FFmpeg Shared...'
          & 7z.exe x $archive "-o$extract" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo extraer FFmpeg Shared.' }

          $ffmpegExe = Get-ChildItem -Path $extract -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw 'No se encontro ffmpeg.exe dentro del paquete descargado.' }

          $bin = $ffmpegExe.Directory.FullName
          $root = Split-Path $bin -Parent
          $ffprobe = Join-Path $bin 'ffprobe.exe'

          if (-not (Test-Path $ffprobe)) { throw 'FFmpeg Shared incompleto: falta ffprobe.exe.' }

          foreach ($pattern in @('avcodec-*.dll','avformat-*.dll','avutil-*.dll','swresample-*.dll')) {
            if (-not (Get-ChildItem -Path $bin -Filter $pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "FFmpeg Shared incompleto: falta $pattern"
            }
          }

          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "AUDITOR_IA_FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AUDITOR_IA_FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & (Join-Path $bin 'ffmpeg.exe') -version | Select-Object -First 1
          & (Join-Path $bin 'ffprobe.exe') -version | Select-Object -First 1
          Write-Host "AUDITOR_IA_FFMPEG_BIN=$bin"

      - name: Build NeMo-Speech.cpp CPU ASR + SortFormer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path '.nemo-src') { Remove-Item '.nemo-src' -Recurse -Force }
          if (Test-Path '.nemo-build') { Remove-Item '.nemo-build' -Recurse -Force }

          git clone --depth 1 --recurse-submodules https://github.com/NVIDIA/NeMo-Speech.cpp.git .nemo-src
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo clonar NeMo-Speech.cpp.' }

          Push-Location .nemo-src
          try {
            powershell -ExecutionPolicy Bypass -File scripts\windows\build.ps1 -Backend cpu -BuildDir "$env:GITHUB_WORKSPACE\.nemo-build" -Config Release -Http
            if ($LASTEXITCODE -ne 0) { throw 'Build NeMo-Speech fallo.' }
          }
          finally {
            Pop-Location
          }

          New-Item -ItemType Directory -Force 'build_assets\nemo-speech' | Out-Null
          cmake --install .nemo-build --config Release --prefix "$env:GITHUB_WORKSPACE\build_assets\nemo-speech"
          if ($LASTEXITCODE -ne 0) { throw 'Install NeMo-Speech fallo.' }

          $nemoExe = 'build_assets\nemo-speech\bin\nemo-speech.exe'
          if (-not (Test-Path $nemoExe)) { throw 'La compilacion termino pero falta nemo-speech.exe.' }
          & $nemoExe --version

      - name: Convertir modelos Nemotron 3.5 y SortFormer Q8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Push-Location .nemo-src
          try {
            python -m pip install -r requirements.txt
            New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\build_assets\models" | Out-Null

            python convert_model.py nvidia/nemotron-3.5-asr-streaming-0.6b --outfile "$env:GITHUB_WORKSPACE\build_assets\models\nemotron-3.5-asr-streaming-0.6b.q8_0.gguf" --outtype q8_0
            if ($LASTEXITCODE -ne 0) { throw 'Conversion Nemotron 3.5 fallo.' }

            python convert_model.py nvidia/diar_streaming_sortformer_4spk-v2 --outfile "$env:GITHUB_WORKSPACE\build_assets\models\sortformer-v2-q8_0.gguf" --outtype q8_0
            if ($LASTEXITCODE -ne 0) { throw 'Conversion SortFormer fallo.' }
          }
          finally {
            Pop-Location
          }

      - name: Verificar motor nativo y activos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nemo = 'build_assets\nemo-speech\bin\nemo-speech.exe'
          $models = @(
            'build_assets\models\nemotron-3.5-asr-streaming-0.6b.q8_0.gguf',
            'build_assets\models\sortformer-v2-q8_0.gguf'
          )

          if (-not (Test-Path $nemo)) { throw 'Falta nemo-speech.exe.' }
          foreach ($model in $models) {
            if (-not (Test-Path $model)) { throw "Falta $model" }
            $size = (Get-Item $model).Length
            if ($size -lt 1048576) { throw "El modelo parece incompleto: $model ($size bytes)" }
          }

          if (-not $env:AUDITOR_IA_FFMPEG_BIN) { throw 'AUDITOR_IA_FFMPEG_BIN no esta definido.' }
          & (Join-Path $env:AUDITOR_IA_FFMPEG_BIN 'ffmpeg.exe') -version | Select-Object -First 1
          & $nemo doctor
          if ($LASTEXITCODE -ne 0) { throw 'nemo-speech doctor fallo.' }

      - name: Tests Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest tests.test_nemo_parser tests.test_role_classifier tests.test_file_selector_stability tests.test_live_restored -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests Python fallaron.' }

      - name: Construir Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build_release.ps1

      - name: Verificar Setup final
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = 'release\AUDITOR_IA_8.0.0_Setup.exe'
          if (-not (Test-Path $setup)) { throw 'No se genero el Setup final.' }
          $bytes = (Get-Item $setup).Length
          if ($bytes -lt 1048576) { throw "El Setup generado parece invalido: $bytes bytes" }
          Write-Host "Setup OK: $setup - $([math]::Round($bytes / 1MB, 2)) MB"

      - name: Guardar Setup
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_8.0.0_Setup
          path: release/AUDITOR_IA_8.0.0_Setup.exe
          if-no-files-found: error
          compression-level: 0
