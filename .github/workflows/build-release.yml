name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actualizar pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) {
            throw "No fue posible actualizar pip/setuptools/wheel."
          }

      - name: Instalar PyTorch CPU
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) {
            throw "Falló la instalación de PyTorch CPU."
          }

          python -c "import torch; print('torch OK:', torch.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "PyTorch no se puede importar después de instalarlo."
          }

      - name: Instalar dependencias de Auditor IA
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            throw "pip install -r requirements.txt FALLÓ. Revisar el error de dependencias mostrado arriba."
          }

          python -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw "pip check detectó dependencias incompatibles."
          }

      - name: Verificar dependencias críticas antes de compilar
        shell: pwsh
        run: |
          python -c "import PySide6, shiboken6; print('PySide6 OK:', PySide6.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "PySide6/shiboken6 no están disponibles. El build se detiene antes de PyInstaller."
          }

          python -c "import faster_whisper, ctranslate2, av; print('Faster-Whisper/CTranslate2/PyAV OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "Faster-Whisper/CTranslate2/PyAV no están disponibles."
          }

          python -c "import pyannote.audio, torchcodec, huggingface_hub; print('pyannote/torchcodec/huggingface_hub OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "pyannote/torchcodec/huggingface_hub no están disponibles."
          }

          python -c "import numpy, docx; print('NumPy/python-docx OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "NumPy/python-docx no están disponibles."
          }

          Write-Host "TODAS LAS DEPENDENCIAS CRITICAS: LISTAS"

      - name: Instalar herramientas de compilación
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.14.2 "pyinstaller-hooks-contrib>=2025.8"
          if ($LASTEXITCODE -ne 0) {
            throw "Falló la instalación de PyInstaller."
          }

          python -c "import PyInstaller, PySide6; print('PyInstaller:', PyInstaller.__version__); print('PySide6 sigue OK:', PySide6.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "Las dependencias críticas dejaron de estar disponibles tras instalar PyInstaller."
          }

      - name: Instalar herramientas de empaquetado
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            throw "Falló la instalación de Inno Setup."
          }

          choco install 7zip --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            throw "Falló la instalación de 7-Zip."
          }

      - name: Construir portable e instalador
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./build_release.ps1

      - name: Verificar ejecutable empaquetado
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path "dist" `
            -Filter "AUDITOR_IA.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "No se encontró AUDITOR_IA.exe para la prueba de arranque."
          }

          Write-Host "PROBANDO EJECUTABLE REAL:"
          Write-Host $exe.FullName

          $env:AUDITOR_IA_SELF_TEST = "1"

          $process = Start-Process `
            -FilePath $exe.FullName `
            -WorkingDirectory $exe.Directory.FullName `
            -Wait `
            -PassThru

          Remove-Item Env:AUDITOR_IA_SELF_TEST

          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path `
              $exe.Directory.FullName `
              "runtime_self_test_error.txt"

            if (Test-Path $errorFile) {
              Write-Host "ERROR DEL SELF-TEST:"
              Get-Content $errorFile
            }

            throw "El ejecutable empaquetado no superó la prueba de dependencias. ExitCode=$($process.ExitCode)"
          }

          Write-Host "SELF-TEST DEL EJECUTABLE: CORRECTO"

      - name: Guardar archivos como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_6.1.1_Windows
          path: |
            release/AUDITOR_IA_6.1.1_Setup.exe
            release/AUDITOR_IA_6.1.1_Portable.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/AUDITOR_IA_6.1.1_Setup.exe" `
            "release/AUDITOR_IA_6.1.1_Portable.zip" `
            --title "AUDITOR IA 6.1.1" `
            --notes "Versión 6.1.1 para Windows con Faster-Whisper Base/Small y pyannote Community-1."
