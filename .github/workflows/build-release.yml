name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Instalación de dependencias falló." }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check encontró incompatibilidades." }

      - name: Ejecutar pruebas
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Las pruebas fallaron." }

      - name: Instalar herramientas de build
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.14.2 "pyinstaller-hooks-contrib>=2025.8"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller falló al instalar." }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló al instalar." }

      - name: Construir instalador
        shell: pwsh
        run: ./build_release.ps1

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: AUDITOR_IA_7.0.0_Setup
          path: release/AUDITOR_IA_7.0.0_Setup.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/AUDITOR_IA_7.0.0_Setup.exe" `
            --title "AUDITOR IA 7.0.0" `
            --notes "Alta precisión con gpt-4o-transcribe-diarize, identificación semántica AGENTE/CLIENTE e interfaz simplificada. Solo instalador Windows."
